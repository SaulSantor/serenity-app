<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Serenity</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <!-- Carrusel de fondo -->
    <div class="bg-carousel">
        <div class="bg-slide active" style="background-image: url('assets/images/meditation-6816204_1920.jpg')"></div>
        <div class="bg-slide" style="background-image: url('assets/images/zen-2404278_1920.jpg')"></div>
        <div class="bg-slide" style="background-image: url('assets/images/Jardin-Zen.jpg')"></div>
        <div class="bg-slide" style="background-image: url('assets/images/sun-4953233_1920.jpg')"></div>
    </div>

    <!-- Login/Register Card -->
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1 class="logo">Serenity</h1>
                <!-- BOTÓN VOLVER -->
                <a href="/" class="back-btn" title="Volver al inicio">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="back-icon">
                        <path d="m12 19-7-7 7-7m7 7H5" />
                    </svg>
                </a>
            </div>
            <p class="subtitle">Tu espacio de paz interior</p>

            <!-- Login Form -->
            <div class="form-container active" id="loginContainer">
                <form id="loginForm">
                    <div class="input-group">
                        <label>Correo electrónico</label>
                        <input type="email" id="loginEmail" placeholder="tu@email.com" required>
                    </div>

                    <div class="input-group">
                        <label>Contraseña</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn">Iniciar Sesión</button>
                </form>

                <div class="divider">O inicia sesión con</div>

                <div class="social-btns">
                    <button class="social-btn" onclick="loginSocial('google')">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18" height="18"
                            aria-hidden="true">
                            <path fill="#FFC107"
                                d="M43.611 20.083H42V20H24v8h11.303C33.184 31.912 29 35 24 35c-6.075 0-11-4.925-11-11s4.925-11 11-11c2.803 0 5.353 1.059 7.293 2.807l5.657-5.657C33.799 6.101 29.136 4 24 4 12.954 4 4 12.954 4 24s8.954 20 20 20 20-8.954 20-20c0-1.34-.138-2.645-.389-3.917z" />
                            <path fill="#FF3D00"
                                d="M6.306 14.691l6.571 4.819C14.6 16.073 18.968 13 24 13c2.803 0 5.353 1.059 7.293 2.807l5.657-5.657C33.799 6.101 29.136 4 24 4 16.318 4 9.902 8.359 6.306 14.691z" />
                            <path fill="#4CAF50"
                                d="M24 44c5.016 0 9.63-1.708 13.206-4.622l-6.1-5.15C28.357 35.186 26.275 36 24 36c-5.017 0-9.263-3.285-10.799-7.807l-6.57 5.06C9.202 39.634 16.096 44 24 44z" />
                            <path fill="#1976D2"
                                d="M43.611 20.083H42V20H24v8h11.303c-1.08 3.104-3.634 5.454-6.897 6.229l6.1 5.15C37.594 36.97 40 31.859 40 26c0-1.34-.138-2.645-.389-3.917z" />
                        </svg>
                        Google
                    </button>
                    <button class="social-btn" onclick="loginSocial('facebook')">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18"
                            aria-hidden="true">
                            <path fill="#1877F2"
                                d="M24 12.073C24 5.404 18.627 0 12 0S0 5.404 0 12.073C0 18.096 4.388 23.096 10.125 24v-8.437H7.078V12.073h3.047V9.414c0-3.007 1.792-4.668 4.533-4.668 1.312 0 2.686.235 2.686.235v2.953h-1.513c-1.49 0-1.954.926-1.954 1.874v2.265h3.328l-.532 3.49h-2.796V24C19.612 23.096 24 18.096 24 12.073z" />
                        </svg>
                        Facebook
                    </button>
                </div>

                <div class="toggle-form">
                    ¿No tienes cuenta? <a onclick="toggleForms()">Regístrate aquí</a>
                </div>
            </div>

            <!-- Register Form -->
            <div class="form-container" id="registerContainer">
                <form id="registerForm">
                    <div class="input-row">
                        <div class="input-group">
                            <label>Nombre</label>
                            <input type="text" id="registerFirstName" placeholder="Nombre" required>
                        </div>
                        <div class="input-group">
                            <label>Apellido</label>
                            <input type="text" id="registerLastName" placeholder="Apellido" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Correo electrónico</label>
                        <input type="email" id="registerEmail" placeholder="tu@email.com" required>
                    </div>

                    <div class="input-group">
                        <label>Contraseña</label>
                        <input type="password" id="registerPassword" placeholder="Mínimo 8 caracteres" minlength="8"
                            required>
                    </div>

                    <div class="input-group">
                        <label>Confirmar contraseña</label>
                        <input type="password" id="registerPasswordConfirm" placeholder="Repite tu contraseña"
                            minlength="8" required>
                    </div>

                    <button type="submit" class="btn">Crear Cuenta</button>
                </form>

                <div class="divider">O regístrate con</div>

                <div class="social-btns">
                    <button class="social-btn" onclick="loginSocial('google')">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18" height="18"
                            aria-hidden="true">
                            <path fill="#FFC107"
                                d="M43.611 20.083H42V20H24v8h11.303C33.184 31.912 29 35 24 35c-6.075 0-11-4.925-11-11s4.925-11 11-11c2.803 0 5.353 1.059 7.293 2.807l5.657-5.657C33.799 6.101 29.136 4 24 4 12.954 4 4 12.954 4 24s8.954 20 20 20 20-8.954 20-20c0-1.34-.138-2.645-.389-3.917z" />
                            <path fill="#FF3D00"
                                d="M6.306 14.691l6.571 4.819C14.6 16.073 18.968 13 24 13c2.803 0 5.353 1.059 7.293 2.807l5.657-5.657C33.799 6.101 29.136 4 24 4 16.318 4 9.902 8.359 6.306 14.691z" />
                            <path fill="#4CAF50"
                                d="M24 44c5.016 0 9.63-1.708 13.206-4.622l-6.1-5.15C28.357 35.186 26.275 36 24 36c-5.017 0-9.263-3.285-10.799-7.807l-6.57 5.06C9.202 39.634 16.096 44 24 44z" />
                            <path fill="#1976D2"
                                d="M43.611 20.083H42V20H24v8h11.303c-1.08 3.104-3.634 5.454-6.897 6.229l6.1 5.15C37.594 36.97 40 31.859 40 26c0-1.34-.138-2.645-.389-3.917z" />
                        </svg>
                        Google
                    </button>
                    <button class="social-btn" onclick="loginSocial('facebook')">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18"
                            aria-hidden="true">
                            <path fill="#1877F2"
                                d="M24 12.073C24 5.404 18.627 0 12 0S0 5.404 0 12.073C0 18.096 4.388 23.096 10.125 24v-8.437H7.078V12.073h3.047V9.414c0-3.007 1.792-4.668 4.533-4.668 1.312 0 2.686.235 2.686.235v2.953h-1.513c-1.49 0-1.954.926-1.954 1.874v2.265h3.328l-.532 3.49h-2.796V24C19.612 23.096 24 18.096 24 12.073z" />
                        </svg>
                        Facebook
                    </button>
                </div>

                <div class="toggle-form">
                    ¿Ya tienes cuenta? <a onclick="toggleForms()">Inicia sesión</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth-utils.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
