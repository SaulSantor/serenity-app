<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EFT Tapping • Serenity</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/meditaciones.css">
  <link rel="stylesheet" href="../css/meditacion-eft.css">
</head>

<body>
  <div class="container">
    <a class="back" href="../dashboard.html#meditaciones"><i class="ri-arrow-left-line"></i> Volver a Meditaciones</a>
    <section class="hero">
      <div class="panel">
        <div class="video" id="videoBox">
          <div>
            <div style="font-weight:600; margin-bottom:6px">Inserta un video (opcional)</div>
            <div style="display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap">
              <input id="yt" placeholder="ID de YouTube (p.ej. dQw4w9WgXcQ)"
                style="padding:8px 10px; border-radius:8px; background:transparent; border:1px solid var(--border); color:var(--text); width:280px">
              <button class="btn btn-ghost" id="load"><i class="ri-video-line"></i> Cargar</button>
            </div>
          </div>
        </div>
        <div class="row" style="margin-top:12px">
          <span class="label">Intensidad (0-10) antes:</span>
          <input id="pre" type="number" min="0" max="10" value="6"
            style="width:64px; padding:8px; border-radius:8px; background:transparent; border:1px solid var(--border); color:var(--text)">
          <span class="label">después:</span>
          <input id="post" type="number" min="0" max="10" value="3"
            style="width:64px; padding:8px; border-radius:8px; background:transparent; border:1px solid var(--border); color:var(--text)">
          <button class="btn btn-ghost" id="save"><i class="ri-save-3-line"></i> Guardar</button>
        </div>
      </div>
      <div class="panel">
        <h2 style="margin:0 0 6px">EFT Tapping (5 min)</h2>
        <p style="color:var(--muted); margin:0 0 10px">Secuencia básica de tapping con una frase neutral. Ajusta
          palabras a tu situación real.</p>
        <div class="row" style="gap:8px; margin-bottom:8px">
          <input id="phrase" placeholder="Frase (p.ej. Aunque siento ansiedad, me acepto)"
            style="flex:1; padding:10px; border-radius:10px; background:transparent; border:1px solid var(--border); color:var(--text)">
          <button class="btn btn-primary" id="start"><i class="ri-play-fill"></i> Iniciar</button>
          <button class="btn btn-ghost" id="pause"><i class="ri-pause-line"></i> Pausa</button>
          <button class="btn btn-ghost" id="reset"><i class="ri-restart-line"></i> Reiniciar</button>
        </div>
        <div class="timer">
          <div class="time" id="time">05:00</div>
        </div>
      </div>
    </section>

    <section class="grid">
      <div class="panel">
        <h3 style="margin:0 0 10px">Puntos</h3>
        <div id="points"></div>
      </div>
      <div class="panel">
        <h3 style="margin:0 0 10px">Indicaciones</h3>
        <div id="inst" style="color:var(--muted); line-height:1.6"></div>
      </div>
    </section>
  </div>

  <script src="../js/dashboard-api-utils.js"></script>
  <script src="../js/meditacion-eft.js"></script>
</body>

</html>
